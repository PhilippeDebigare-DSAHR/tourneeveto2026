name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Publish application
        run: dotnet publish src/TourneeVeto.Web/TourneeVeto.Web.csproj --configuration Release --output "$RUNNER_TEMP/publish"

      - name: Set the GitHub Pages base path
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          set -euo pipefail
          base_path="/${PAGES_BASE_PATH#/}"
          base_path="${base_path%/}/"

          for page in "$RUNNER_TEMP/publish/wwwroot/index.html" "$RUNNER_TEMP/publish/wwwroot/404.html"; do
            sed -i "s|<base href=\"/\" />|<base href=\"$base_path\" />|" "$page"
            grep -Fq "<base href=\"$base_path\" />" "$page"
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!DOCTYPE html>
<html lang="fr-CA">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TournéeVéto</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="_content/TourneeVeto.Ui/tokens.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TourneeVeto.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Une erreur inattendue est survenue.
        <a href="." class="reload">Recharger</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' })
                .catch(error => {
                    console.error('Échec de préparation du mode hors ligne.', error);
                    const errorUi = document.getElementById('blazor-error-ui');
                    errorUi.firstChild.textContent = 'Le mode hors ligne n’a pas pu être préparé. Vérifiez la connexion et rechargez.';
                    errorUi.style.display = 'block';
                });
        }
    </script>
</body>

</html>
